<!doctype html>
<html lang="lv">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{% block title %}Pasūtījumu uzskaite{% endblock %}</title>
		<link rel="stylesheet" href="/static/styles.css" />
	</head>
	<body>
		<header class="topbar">
			<div class="container">
				<strong>Pasūtījumu un termiņu uzskaite</strong>
				<nav style="float:right">
					{% if user %}
						<span>{{ user.name }} ({{ 'Administrators' if user.role == 'admin' else 'Lietotājs' }})</span>
						<a href="/panelis">Panelis</a>
						<a href="/iziet">Iziet</a>
					{% endif %}
				</nav>
			</div>
		</header>
		<main class="container">
			{% block content %}{% endblock %}
		</main>
	</body>
</html>
